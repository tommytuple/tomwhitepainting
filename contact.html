<!doctype html>
<html style="scroll-behavior: smooth" lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            Tom White - Painter &amp; Decorator - Brighton &amp; Hove | Contact
        </title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/@digicreon/mucss/dist/mu.azure.css"
        />
    </head>
    <body class="container" style="margin-top: 2rem">
        <section>
            <img
                src="photos/tomwhite_logo.webp"
                alt="Tom White Logo"
            />
        </section>

        <main>
            <article >
                <nav>
                    <input
                        type="checkbox"
                        id="my-nav"
                        class="navbar-toggle"
                        hidden
                    />

                    <label for="my-nav" class="navbar-burger">&#9776;</label>
                    <ul class="navbar-menu">
                        <ul class="navbar-menu">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="testimonials.html">Testimonials</a></li>
                            <li><a href="about.html">About Me</a></li>
                            <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </article>

            <article
                id="contact"
                class="card-primary"
                style="margin-bottom: 3rem"
            >
                <header><h3>Get in Touch</h3></header>

                <form action="https://formspree.io/f/mgoqryll" method="POST">
                    <label
                        >Your name
                        <input
                            type="text"
                            name="name"
                            placeholder="Your name"
                            required
                        />
                    </label>

                    <label
                        >Email address
                        <input
                            type="email"
                            name="email"
                            placeholder="your@email.com"
                            required
                        />
                    </label>

                    <fieldset>
                        <legend>Type of work</legend>
                        <label
                            ><input
                                type="radio"
                                name="work_type"
                                value="Interior"
                                required
                            />
                            Interior</label
                        >
                        <label
                            ><input
                                type="radio"
                                name="work_type"
                                value="Exterior"
                            />
                            Exterior</label
                        >
                        <label
                            ><input
                                type="radio"
                                name="work_type"
                                value="Both"
                            />
                            Both</label
                        >
                    </fieldset>

                    <fieldset>
                        <legend>Working alongside other trades?</legend>
                        <label
                            ><input
                                type="radio"
                                name="other_trades"
                                value="Yes"
                                required
                            />
                            Yes</label
                        >
                        <label
                            ><input
                                type="radio"
                                name="other_trades"
                                value="No"
                            />
                            No</label
                        >
                    </fieldset>

                    <fieldset>
                        <legend>Private or commercial?</legend>
                        <label
                            ><input
                                type="radio"
                                name="job_type"
                                value="Private"
                                required
                            />
                            Private</label
                        >
                        <label
                            ><input
                                type="radio"
                                name="job_type"
                                value="Commercial"
                            />
                            Commercial</label
                        >
                    </fieldset>

                    <label
                        >Preferred start date <small>(optional)</small>
                        <input
                            type="text"
                            name="start_date"
                            placeholder="e.g. early March, after Easter…"
                        />
                    </label>

                    <label
                        >Required finish date <small>(optional)</small>
                        <input
                            type="text"
                            name="finish_date"
                            placeholder="e.g. end of April, flexible…"
                        />
                    </label>

                    <label
                        >Message
                        <textarea
                            name="message"
                            rows="6"
                            placeholder="Tell me a bit about the job…"
                            required
                        ></textarea>
                    </label>

                    <button type="submit" class="btn-primary">
                        Send message
                    </button>
                </form>
            </article>
        </main>
    </body>
</html>
